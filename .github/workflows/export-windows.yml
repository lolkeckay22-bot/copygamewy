name: Export Windows (Godot 3.5.3)

on:
  push:
    branches: [main]
    paths:
      - "Game/Source/**"
      - ".github/workflows/export-windows.yml"
  # Run the same build on pull requests so changes are validated before merge.
  pull_request:
    paths:
      - "Game/Source/**"
      - ".github/workflows/export-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-windows:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 3.5.3 + export templates
        run: |
          set -euo pipefail
          GODOT_VERSION="3.5.3"
          GODOT_STATUS="stable"
          BIN_NAME="Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux_headless.64"
          mkdir -p "$HOME/godot" "$HOME/.local/share/godot/templates/${GODOT_VERSION}.${GODOT_STATUS}"
          cd "$HOME/godot"
          curl -fL --retry 3 -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/${BIN_NAME}.zip"
          unzip -o -q godot.zip
          chmod +x "$BIN_NAME"
          curl -fL --retry 3 -o templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_export_templates.tpz"
          # The .tpz wraps everything in a top-level templates/ dir; Godot expects a flat layout.
          unzip -o -q templates.tpz -d tpl
          mv tpl/templates/* "$HOME/.local/share/godot/templates/${GODOT_VERSION}.${GODOT_STATUS}/"
          test -f "$HOME/.local/share/godot/templates/${GODOT_VERSION}.${GODOT_STATUS}/windows_64_release.exe"
          echo "Godot $("$HOME/godot/$BIN_NAME" --version) + windows_64_release template ready"

      - name: Verify project layout
        run: |
          set -euo pipefail
          test -f Game/Source/project.godot
          test -f Game/Source/export_presets.cfg
          test -f Game/Source/Main.tscn
          test -f Game/Source/icon.ico
          grep -q 'name="Windows Desktop"' Game/Source/export_presets.cfg

      # The headless editor imports every resource on startup but never exits on its
      # own, so it is run in bounded passes. A pass is considered done once the
      # import cache stops growing, and the result is verified below.
      - name: Import resources (headless editor)
        run: |
          set -euo pipefail
          BIN="$HOME/godot/Godot_v3.5.3-stable_linux_headless.64"
          cd Game/Source
          export GODOT_SILENCE_ROOT_WARNING=1
          count() { find .import -type f 2>/dev/null | wc -l || true; }
          # On a fresh checkout .import/ does not exist yet. Without this, find
          # exits non-zero and `set -o pipefail` aborts the step before the first
          # pass even starts.
          mkdir -p .import
          # Each pass runs until the editor is killed; a pass where the cache did not
          # grow means the import has converged. 180s is ~4x the observed ~40s.
          for pass in 1 2 3; do
            before=$(count)
            echo "import pass $pass (cache: $before files)"
            timeout 180 "$BIN" --headless --editor >/dev/null 2>&1 || true
            after=$(count)
            echo "import pass $pass finished (cache: $after files)"
            if [ "$after" -gt 0 ] && [ "$after" -eq "$before" ]; then
              echo "import cache is stable"
              break
            fi
          done

      - name: Verify import completeness
        run: |
          set -euo pipefail
          cd Game/Source
          # Every non-import source resource must have a generated .import sibling,
          # and every artifact those .import files reference must actually exist.
          missing=0
          while IFS= read -r f; do
            [ -f "$f.import" ] || { echo "no .import for $f"; missing=1; continue; }
            ref=$(grep -o 'res://\.import/[^"]*' "$f.import" | head -1 || true)
            if [ -n "$ref" ]; then
              p="${ref#res://}"
              [ -f "$p" ] || { echo "missing imported artifact $p (for $f)"; missing=1; }
            fi
          done < <(find assets ico -type f \( -name '*.png' -o -name '*.jpg' -o -name '*.wav' -o -name '*.gltf' \))
          if [ "$missing" -ne 0 ]; then
            echo "::error::Resource import is incomplete; export would produce a broken pack."
            exit 1
          fi
          echo "all resources imported"

      # NOTE: Godot 3.5 uses `--export` for release templates. `--export-release` is a
      # Godot 4 flag; on 3.5 it is silently ignored and Godot just *runs the game*,
      # which never exits and hangs the step until the timeout.
      - name: Headless export (Windows Desktop)
        run: |
          set -euo pipefail
          BIN="$HOME/godot/Godot_v3.5.3-stable_linux_headless.64"
          cd Game/Source
          export GODOT_SILENCE_ROOT_WARNING=1
          timeout 600 "$BIN" --headless --export "Windows Desktop" "$GITHUB_WORKSPACE/Game/Skyfront.exe"
          ls -lh "$GITHUB_WORKSPACE/Game/"

      - name: Embed Skyfront icon into Windows executable
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq wine64 python3-pefile
          curl -fL --retry 3 -o "$RUNNER_TEMP/rcedit-x64.exe" \
            "https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe"
          export WINEDEBUG=-all
          export WINEPREFIX="$RUNNER_TEMP/skyfront-wine"
          wine "$RUNNER_TEMP/rcedit-x64.exe" \
            "$(winepath -w "$GITHUB_WORKSPACE/Game/Skyfront.exe")" \
            --set-icon "$(winepath -w "$GITHUB_WORKSPACE/Game/Source/icon.ico")"
          python3 - <<'PY'
          import struct
          import pefile
          from pathlib import Path
          ico=Path("Game/Source/icon.ico").read_bytes()
          exe=pefile.PE("Game/Skyfront.exe")
          icons=[]
          for kind in exe.DIRECTORY_ENTRY_RESOURCE.entries:
              if kind.id!=3: continue  # RT_ICON
              for entry in kind.directory.entries:
                  for lang in entry.directory.entries:
                      data=lang.data.struct
                      icons.append(exe.get_data(data.OffsetToData,data.Size))
          expected=[]
          for i in range(struct.unpack_from("<H",ico,4)[0]):
              size,offset=struct.unpack_from("<II",ico,6+16*i+8)
              expected.append(ico[offset:offset+size])
          assert expected and all(blob in icons for blob in expected), "Windows exe lacks the Skyfront icon images"
          print("Skyfront icon embedded:",len(expected),"sizes")
          PY

      - name: Verify export
        run: |
          set -euo pipefail
          test -s Game/Skyfront.exe
          test -s Game/Skyfront.pck
          # Confirm a real 64-bit Windows PE, not a stub or renamed file.
          head -c2 Game/Skyfront.exe | grep -q 'MZ'
          off=$(od -A n -t u4 -j 60 -N 4 Game/Skyfront.exe | tr -d ' ')
          od -A n -t x1 -j "$off" -N 4 Game/Skyfront.exe | tr -d ' \n' | grep -qi '50450000'
          head -c4 Game/Skyfront.pck | grep -q 'GDPC'
          echo "Skyfront.exe is a valid Windows PE (offset $off), Skyfront.pck is a valid Godot pack"
          ls -lh Game/Skyfront.*

      - name: Smoke test (in-engine)
        run: |
          set -euo pipefail
          BIN="$HOME/godot/Godot_v3.5.3-stable_linux_headless.64"
          cd Game/Source
          export GODOT_SILENCE_ROOT_WARNING=1
          # Rendering errors from the dummy rasterizer are expected here; only the
          # test results themselves matter.
          timeout 300 "$BIN" --headless --smoke-test --video-driver Dummy --audio-driver Dummy 2>&1 \
            | tee "$RUNNER_TEMP/smoke.log" | grep -E 'TEST |METRICS' || true
          grep -q 'TEST FAIL' "$RUNNER_TEMP/smoke.log" && { echo "::error::Smoke test failed"; exit 1; }
          grep -q 'TEST FINISHED' "$RUNNER_TEMP/smoke.log" || { echo "::error::Smoke test did not finish"; exit 1; }
          echo "smoke test passed"

      - name: Run landing cycle tests for both aircraft
        run: |
          set -euo pipefail
          cd Game/Source
          BIN="$HOME/godot/Godot_v3.5.3-stable_linux_headless.64"
          export GODOT_SILENCE_ROOT_WARNING=1
          for option in "" "--biplane"; do
            timeout 240 "$BIN" --headless --landing-test $option --video-driver Dummy --audio-driver Dummy \
              > "$RUNNER_TEMP/landing.log" 2>&1 || { tail -80 "$RUNNER_TEMP/landing.log"; exit 1; }
            grep 'LANDING ' "$RUNNER_TEMP/landing.log" || true
            if grep -q 'LANDING FAIL' "$RUNNER_TEMP/landing.log" || ! grep -q 'LANDING COMPLETE' "$RUNNER_TEMP/landing.log"; then
              tail -80 "$RUNNER_TEMP/landing.log"; exit 1
            fi
          done

      - name: Verify Su-27 high-alpha flight
        run: |
          set -euo pipefail
          cd Game/Source
          BIN="$HOME/godot/Godot_v3.5.3-stable_linux_headless.64"
          export GODOT_SILENCE_ROOT_WARNING=1
          timeout 120 "$BIN" --headless --maneuver-test --video-driver Dummy --audio-driver Dummy \
            > "$RUNNER_TEMP/maneuver.log" 2>&1 || { tail -80 "$RUNNER_TEMP/maneuver.log"; exit 1; }
          grep -E 'MANEUVER |SPEED ' "$RUNNER_TEMP/maneuver.log"
          grep -q 'MANEUVER PASS' "$RUNNER_TEMP/maneuver.log"
          grep -q 'SPEED PASS' "$RUNNER_TEMP/maneuver.log"

      - name: Profile pools and repeated respawns
        run: |
          set -euo pipefail
          cd Game/Source
          BIN="$HOME/godot/Godot_v3.5.3-stable_linux_headless.64"
          export GODOT_SILENCE_ROOT_WARNING=1
          timeout 180 "$BIN" --headless --performance-test --video-driver Dummy --audio-driver Dummy \
            > "$RUNNER_TEMP/performance.log" 2>&1 || { tail -100 "$RUNNER_TEMP/performance.log"; exit 1; }
          grep 'PERF ' "$RUNNER_TEMP/performance.log"
          grep -q 'PERF failures=0' "$RUNNER_TEMP/performance.log"

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Skyfront-windows
          path: |
            Game/Skyfront.exe
            Game/Skyfront.pck
          if-no-files-found: error

